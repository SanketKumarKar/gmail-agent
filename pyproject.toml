[project]
name = "gmail-agent"
version = "0.1.0"
description = "Gmail Agent for summarizing internship and placement emails using LangGraph and MCP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-api-python-client>=2.200.0",
    "google-auth-httplib2>=0.4.2",
    "google-auth-oauthlib>=1.4.1",
    "langchain>=1.3.18",
    "langchain-google-genai>=4.4.0",
    "langchain-openai>=1.6.0",
    "langgraph>=1.2.11",
    "mcp>=2.1.1",
    "python-dotenv>=1.2.3",
]

[project.scripts]
gmail-agent = "gmail_agent.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gmail_agent"]
